services:
  nuxt-app:
    build: .
    container_name: statsio-front
    # Requis pour que le SSR dans le conteneur atteigne l'API publiée sur l'hôte :
    # sans ça `host.docker.internal` ne résout pas ici (→ fetch failed / pages SSR vides).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8080/api
      - NUXT_PUBLIC_AUTH_API_BASE_URL=http://localhost:8080/api/auth
      # SSR dans le conteneur : localhost:8080 pointe vers le conteneur, pas l'hôte.
      - NUXT_API_BASE_URL_SERVER=http://host.docker.internal:8080/api
    volumes:
      - .:/app
      # Volumes anonymes : garder les artefacts de build dans le conteneur pour que
      # d'éventuels restes générés sur l'hôte (ancienne version de Nuxt, etc.) ne
      # masquent pas ceux régénérés par le conteneur (sinon 500 « Vite Error /
      # Transform failed » faute de .nuxt/tsconfig.json).
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
