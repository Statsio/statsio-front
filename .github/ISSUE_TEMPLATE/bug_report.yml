name: "Signalement d'anomalie"
description: "Consigner un bogue rencontré sur le frontend (production, staging ou développement)"
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Un résumé clair du problème.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      description: Étapes précises, numérotées, permettant de reproduire le bogue à coup sûr.
      placeholder: |
        1. Aller sur la page ...
        2. Cliquer sur ...
        3. Observer ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Production
        - Staging
        - Développement local
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Sévérité
      description: "Critique : parcours utilisateur bloqué. Majeure : fonctionnalité importante cassée, contournement possible. Mineure : impact visuel ou limité."
      options:
        - Critique
        - Majeure
        - Mineure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Navigateur / appareil
      description: "Ex. Chrome 128 / Desktop, Safari / iPhone 14."
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / commit concerné
      description: "Tag, hash de commit, ou date de déploiement si connus."
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs, captures d'écran
      description: Toute preuve utile au diagnostic (console navigateur, capture d'écran).
    validations:
      required: false
