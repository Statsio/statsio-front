name: Deploy Frontend

on:
  push:
    branches: [main, staging]

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Build & Deploy to Cloudflare (${{ github.ref_name }})
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check required variables
        run: |
          : "${NUXT_PUBLIC_API_BASE_URL:?Variable NUXT_PUBLIC_API_BASE_URL is empty — add it to the GitHub Production environment}"
          : "${NUXT_PUBLIC_GOOGLE_CLIENT_ID:?Variable NUXT_PUBLIC_GOOGLE_CLIENT_ID is empty — add it to the GitHub Production environment}"
        env:
          NUXT_PUBLIC_API_BASE_URL: ${{ vars.NUXT_PUBLIC_API_BASE_URL }}
          NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NUXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Create .env
        run: |
          echo "NUXT_PUBLIC_API_BASE_URL=${{ vars.NUXT_PUBLIC_API_BASE_URL }}" >> .env
          echo "NUXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NUXT_PUBLIC_GOOGLE_CLIENT_ID }}" >> .env
          echo "NUXT_PUBLIC_APP_ENV=${{ vars.NUXT_PUBLIC_APP_ENV }}" >> .env
          echo "NUXT_PUBLIC_PASSWORD_MIDDLEWARE=${{ secrets.NUXT_PUBLIC_PASSWORD_MIDDLEWARE }}" >> .env
          echo "NUXT_PUBLIC_COMING_SOON=${{ vars.NUXT_PUBLIC_COMING_SOON }}" >> .env
          echo "NUXT_PUBLIC_COMING_SOON_BYPASS_CODE=${{ vars.NUXT_PUBLIC_COMING_SOON_BYPASS_CODE }}" >> .env
          echo "NUXT_PUBLIC_SENTRY_DSN=${{ vars.NUXT_PUBLIC_SENTRY_DSN }}" >> .env
          # Écrit seulement si défini : sinon le fallback nuxt.config.ts (site key déjà provisionné) s'applique
          TURNSTILE_SITE_KEY="${{ vars.NUXT_PUBLIC_TURNSTILE_SITE_KEY }}"
          [ -n "$TURNSTILE_SITE_KEY" ] && echo "NUXT_PUBLIC_TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY" >> .env

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: |
          VARS=(
            --var "NUXT_PUBLIC_API_BASE_URL:$NUXT_PUBLIC_API_BASE_URL"
            --var "NUXT_PUBLIC_GOOGLE_CLIENT_ID:$NUXT_PUBLIC_GOOGLE_CLIENT_ID"
            --var "NUXT_PUBLIC_SENTRY_DSN:$NUXT_PUBLIC_SENTRY_DSN"
          )
          # Var optionnelle : n'écrase le fallback compilé dans nuxt.config.ts que si définie
          [ -n "$NUXT_PUBLIC_TURNSTILE_SITE_KEY" ] && VARS+=(--var "NUXT_PUBLIC_TURNSTILE_SITE_KEY:$NUXT_PUBLIC_TURNSTILE_SITE_KEY")

          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler deploy "${VARS[@]}"
          else
            npx wrangler deploy --env staging "${VARS[@]}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUXT_PUBLIC_API_BASE_URL: ${{ vars.NUXT_PUBLIC_API_BASE_URL }}
          NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NUXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ vars.NUXT_PUBLIC_SENTRY_DSN }}
          NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NUXT_PUBLIC_TURNSTILE_SITE_KEY }}
